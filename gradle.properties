# Память JVM для компиляции
org.gradle.jvmargs=-Xmx2G

# Версии игры и Fabric под 1.21.3
minecraft_version=1.21.3
yarn_mappings=1.21.3+build.2:v2
loader_version=0.16.9
fabric_version=0.107.0+1.21.3

# Данные мода
mod_version=1.0.0
maven_group=com.restoration
archives_base_name=bedrock_restorer

